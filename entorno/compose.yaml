services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_laboratorio
    restart: always
    environment:
      POSTGRES_DB: laboratorio_db
      POSTGRES_USER: admin_lab
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - ../practica2/proyecto-propio/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
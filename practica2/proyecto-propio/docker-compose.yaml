version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_laboratorio
    restart: always
    environment:
      POSTGRES_DB: laboratorio_db
      POSTGRES_USER: admin_lab
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql